apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: dbconfigsyncs.config.operator.io
spec:
  group: config.operator.io
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - databases
              properties:
                targetConfigMap:
                  type: string
                targetSecret:
                  type: string
                reflection:
                  type: object
                  properties:
                    allowed:
                      type: boolean
                    allowedNamespaces:
                      type: string
                    autoEnabled:
                      type: boolean
                    autoNamespaces:
                      type: string
                databases:
                  type: array
                  items:
                    type: object
                    required:
                      - type
                      - query
                    properties:
                      type:
                        type: string
                        enum:
                          - postgresql
                          - postgres
                          - mysql
                          - redis
                          - mongodb
                          - mongo
                      connectionUri:
                        type: string
                        description: "Inline connection URI for the database. At least one of connectionUri or connectionSecretRef must be specified. When both are set, connectionSecretRef takes precedence."
                      connectionSecretRef:
                        type: object
                        description: "Reference to a Kubernetes Secret containing the connection URI. At least one of connectionUri or connectionSecretRef must be specified. When both are set, this field takes precedence."
                        required:
                          - name
                          - key
                        properties:
                          name:
                            type: string
                          namespace:
                            type: string
                          key:
                            type: string
                      query:
                        type: string
                      keyMapping:
                        type: object
                        additionalProperties:
                          type: string
                transforms:
                  type: array
                  items:
                    type: object
                    required:
                      - name
                      - type
                    properties:
                      name:
                        type: string
                      type:
                        type: string
                        enum:
                          - template
                          - join
                          - base64
                          - jsonpath
                      template:
                        type: string
                      separator:
                        type: string
                      sourceKeys:
                        type: array
                        items:
                          type: string
                      sourcePattern:
                        type: string
                      sourceKey:
                        type: string
                      operation:
                        type: string
                        enum:
                          - encode
                          - decode
                        description: "Base64 operation to apply. Defaults to 'encode' if omitted."
                      jsonPath:
                        type: string
            status:
              type: object
              properties:
                lastReconciled:
                  type: string
                activeVersion:
                  type: integer
                syncStatus:
                  type: string
                message:
                  type: string
                databaseStatuses:
                  type: object
                  additionalProperties:
                    type: string
      subresources:
        status: {}
  scope: Namespaced
  names:
    plural: dbconfigsyncs
    singular: dbconfigsync
    kind: DbConfigSync
    shortNames:
      - dbsync
