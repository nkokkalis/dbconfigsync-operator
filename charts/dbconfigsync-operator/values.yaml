# Default values for dbconfigsync-operator.
# This is a YAML-formatted file.

replicaCount: 1

image:
  repository: ghcr.io/nkokkalis/dbconfigsync-operator
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

rbac:
  # Specifies whether ClusterRole and ClusterRoleBinding should be created
  create: true



resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi

nodeSelector: {}

tolerations: []

affinity: {}

# Settings for the operator configuration manager
operator:
  # The namespace that the operator will watch for DbConfigSync CRs.
  # If left empty, it will watch the namespace it is deployed in.
  watchNamespace: "operator-system"
